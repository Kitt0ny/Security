<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }
        .welcome-message {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h2 class="welcome-message">
        Добро пожаловать, <span th:text="${user}">Пользователь</span>!
    </h2>

    <form action="/login" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Логин</label>
            <input type="text"
                   class="form-control"
                   id="username"
                   name="username"
                   required
                   placeholder="Введите логин">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password"
                   class="form-control"
                   id="password"
                   name="password"
                   required
                   placeholder="Введите пароль">
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
            <label class="form-check-label" for="rememberMe">Запомнить меня</label>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg">Войти</button>
        </div>

        <div class="text-center mt-3">
            <a href="#" class="text-decoration-none">Забыли пароль?</a>
        </div>

        <div th:if="${param.error}" class="alert alert-danger mt-3" role="alert">
            Неверный логин или пароль!
        </div>

        <div th:if="${param.logout}" class="alert alert-success mt-3" role="alert">
            Вы успешно вышли из системы!
        </div>
    </form>

    <div class="mt-4 text-center">
        <p class="mb-0">Нет аккаунта?
            <a href="/api/register" class="text-decoration-none fw-bold">Зарегистрироваться</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
