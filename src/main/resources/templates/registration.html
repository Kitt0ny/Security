<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .registration-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="registration-container">
    <h1>Регистрация</h1>

    <form id="registrationForm">
        <div class="form-group">
            <label for="login">Логин:</label>
            <input
                    type="text"
                    id="login"
                    name="login"
                    required
                    placeholder="Введите логин"
            >
        </div>

        <div class="form-group">
            <label for="password">Пароль:</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Введите пароль"
            >
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="Введите email"
            >
        </div>

        <button type="submit" id="registerBtn">
            Зарегистрироваться
        </button>
    </form>

    <div id="message" class="message"></div>

    <div class="login-link">
        Уже есть аккаунт? <a href="/api/loginPage">Войти</a>
    </div>
</div>

<script>
    document.getElementById('registrationForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const registerBtn = document.getElementById('registerBtn');
        const messageDiv = document.getElementById('message');

        // Получаем значения из формы
        const login = document.getElementById('login').value.trim();
        const password = document.getElementById('password').value;
        const email = document.getElementById('email').value.trim();

        // Создаем объект для отправки
        const registerRequest = {
            login: login,
            password: password,
            email: email
        };

        // Показываем состояние загрузки
        registerBtn.textContent = 'Регистрация...';
        registerBtn.disabled = true;

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(registerRequest)
            });

            const data = await response.json();

            if (response.ok) {
                // Успешная регистрация
                showMessage('Регистрация успешна! Проверьте ваш email для подтверждения.', 'success');

                // Очищаем форму
                document.getElementById('registrationForm').reset();

                // Перенаправление на страницу входа через 3 секунды
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            } else {
                // Ошибка регистрации
                const errorMessage = data.message || 'Ошибка регистрации';
                showMessage(errorMessage, 'error');
            }
        } catch (error) {
            showMessage('Ошибка соединения с сервером', 'error');
            console.error('Ошибка:', error);
        } finally {
            // Восстанавливаем кнопку
            registerBtn.textContent = 'Зарегистрироваться';
            registerBtn.disabled = false;
        }
    });

    function showMessage(text, type) {
        const messageDiv = document.getElementById('message');
        messageDiv.textContent = text;
        messageDiv.className = `message ${type}`;
        messageDiv.style.display = 'block';

        // Автоматически скрывать сообщение через 5 секунд
        setTimeout(() => {
            messageDiv.style.display = 'none';
        }, 5000);
    }

    // Простая валидация email
    document.getElementById('email').addEventListener('blur', function() {
        const email = this.value;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (email && !emailRegex.test(email)) {
            showMessage('Введите корректный email адрес', 'error');
        }
    });

    // Проверка пароля на минимальную длину
    document.getElementById('password').addEventListener('blur', function() {
        const password = this.value;
        if (password && password.length < 6) {
            showMessage('Пароль должен содержать минимум 6 символов', 'error');
        }
    });
</script>
</body>
</html>
